services:
  redis:
    image: redis:7-alpine
    container_name: torresmin-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - torresmin-net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: torresmin-prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - prowlarr-config:/config
    ports:
      - "9696:9696"
    networks:
      - torresmin-net

  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    container_name: torresmin-torrserver
    restart: unless-stopped
    volumes:
      - torrserver-data:/opt/ts
    ports:
      - "8092:8090"
    networks:
      - torresmin-net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: torresmin-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
    ports:
      - "8191:8191"
    networks:
      - torresmin-net

  torresmin:
    build:
      context: .
      target: dev
    container_name: torresmin-app
    restart: unless-stopped
    depends_on:
      - redis
      - prowlarr
      - torrserver
    env_file:
      - .env.local-stack
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - torresmin-data:/data
    ports:
      - "7015:7860"
    networks:
      - torresmin-net

networks:
  torresmin-net:
    driver: bridge

volumes:
  redis-data:
  prowlarr-config:
  torresmin-data:
  torrserver-data:
  node_modules:
